services:
  # Backend (Go) — Traefik roteia /api/* direto pra cá
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    expose:
      - "8087"
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-fb_farol}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - APP_MODULE=${APP_MODULE:-farol}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://farol.fbtax.cloud}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://farol.fbtax.cloud}
      - IMPORT_UPLOAD_DIR=/root/uploads/imports
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
    networks:
      # Alias único 'farol-api' evita colisão de DNS entre stacks Coolify — se
      # outro produto (APU01/02/04, SMARTPICK, FBTAX) resolver o hostname
      # genérico 'api', não colide. Padrão já aplicado nos irmãos, ver
      # coolify-dns-collision.md.
      fb_net:
        aliases:
          - farol-api
      coolify: {}

  # Frontend (React/Nginx) — rota pro Cloudflare Tunnel abaixo (labels
  # traefik.* removidos em 22/10: o túnel já está validado e ativo desde
  # 21/10 — "farol.fbtax.cloud" e "farol.fbtax.cloud/^/api" nas Routes do
  # túnel fb-farol-prod — manter o fallback do Traefik continuava expondo
  # o IP de origem da VPS como caminho alternativo, direto, sem WAF/DDoS).
  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=${VITE_APP_MODULE:-farol}
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  # Banco de Dados
  db:
    image: postgres:15-alpine
    restart: always
    # Tuning 25/07/2026 — host migrou KVM2→KVM4 (15GB RAM, 4vCPU, ~13GB livres).
    # Antes rodava no default de fábrica (shared_buffers=128MB, work_mem=4MB):
    # o "P3" documentado em .planning/performance-plan.md foi aplicado só no
    # docker-compose.prod.yml, que o Coolify NÃO usa — nunca chegou a valer.
    # Orçamento de ~4GB pro Postgres do FAROL (maior tenant do host, 44GB de
    # dado vs ~9GB do 2º maior) deixando o resto pros outros ~6 projetos.
    # /dev/shm — o Docker dá 64MB por default, e é ali que o Postgres aloca a
    # memória compartilhada dinâmica das consultas PARALELAS (fila de tuplas
    # entre workers, hash compartilhado). Com 18M linhas em vendas_*, os scans
    # do filtro cruzado rodam em paralelo e estouraram esse teto em 27/07/2026:
    #   ERRO: could not resize shared memory segment ... No space left on device
    # A consulta MORRE e o painel mostra 0 cards — falha silenciosa para o
    # usuário. Agravado pelo SET LOCAL work_mem=256MB (queryWithHigherWorkMem),
    # que aumenta o tamanho dos segmentos pedidos por worker.
    # tmpfs: consome RAM só conforme aloca de fato, não reserva 1GB.
    shm_size: 1gb
    # random_page_cost / effective_io_concurrency — os dois defaults de fábrica
    # descrevem um HD com prato girando, e o host é SSD.
    #
    # O planejador fixa a leitura sequencial em 1,0 e usa random_page_cost para
    # precificar a aleatória; o default 4,0 diz "aleatória custa 4x". Como
    # varrer índice é feito de leituras aleatórias, ele superfatura o índice e
    # prefere varrer a tabela inteira. Medido nesta base durante a investigação
    # de particionamento (jul/2026): com 1,1 o custo de uma das consultas lentas
    # caiu 45% e o plano trocou de Seq Scan para Index Only Scan.
    #
    # effective_io_concurrency é o par: quantas leituras o disco atende em
    # paralelo, usado para prefetch em bitmap heap scan. O default é 1 — um
    # spindle. SSD atende centenas.
    #
    # ⚠ Mexer neste bloco faz o Coolify RECRIAR o container do Postgres. Nunca
    #   com import rodando.
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=4GB
      -c maintenance_work_mem=512MB
      -c work_mem=32MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-fb_farol}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria a database se não existir (POSTGRES_DB só roda no init do volume vazio)
  db-init:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${DB_PASSWORD:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_NAME=${DB_NAME:-fb_farol}
    restart: "no"
    command: >
      sh -c "
        psql -h db -U $$DB_USER -tc \"SELECT 1 FROM pg_database WHERE datname = '$$DB_NAME'\" | grep -q 1 ||
        psql -h db -U $$DB_USER -c \"CREATE DATABASE \\\"$$DB_NAME\\\"\"
      "
    networks:
      - fb_net

  # Redis
  redis:
    image: redis:alpine
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    networks:
      - fb_net

  # Cloudflare Tunnel (21/10, ativado e validado em 22/10) — único caminho
  # público pra farol.fbtax.cloud agora (rotas no painel: hostname raiz ->
  # http://web:80, hostname+path ^/api -> http://api:8087).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fb_farol-cloudflared-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fb_net
    depends_on:
      - web

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  api_uploads:
